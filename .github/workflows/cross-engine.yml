name: Cross-Engine JS Tests

# Issue #35: `new Date(string)` handles the HTTP-date formats that RFC 6265
# requires senders to produce inconsistently across JS engines - Hermes, for
# example, cannot parse the asctime() format and reads two-digit years as 19xx.
# These tests run the same assertions under node (V8), Hermes, and JavaScriptCore
# so the library's own date parser gets exercised on all three.

on: [push, pull_request]

jobs:
  cross-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Hermes and JavaScriptCore via JSVU
        run: npx jsvu --os=linux64 --engines=hermes,javascriptcore

      - name: Run cross-engine tests
        run: npm run test:cross-engine